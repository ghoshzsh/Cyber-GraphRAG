[project]
name = "threat-intel-edu"
version = "1.0.0"
description = "Educational project: LangChain + LangGraph + GraphRAG + MCP for Threat Intel"
requires-python = ">=3.11"
dependencies = [
    # LLM & Agent orchestration (NIM is OpenAI-compatible)
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langgraph>=0.2",

    # MCP (Model Context Protocol)
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
    "fastmcp>=1.0",

    # Graph (replacing networkx)
    "falkordb>=1.0",           # Graph database (Redis-based)
    "graphiti-core[falkordb]", # GraphRAG / knowledge graph framework

    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dotenv>=1.0",

    # Utilities
    "rich>=13.0",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
